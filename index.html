<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17352a">
<title>EcoRuta · Gestión y educación en residuos sólidos</title>
<meta name="description" content="EcoRuta: rutas y horarios de recolección, reportes ciudadanos e indicadores del servicio de aseo del área metropolitana de Bucaramanga.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232e7d32'/><path d='M9 21c0-7 5-11 14-11-1 9-5 13-11 13l-3 3' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="barra">
  <div class="barra-in">
    <a class="logo" href="#/inicio" aria-label="EcoRuta, inicio">
      <span class="logo-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></span>
      <span>Eco<b>Ruta</b></span>
    </a>
    <label class="selector-rol"><span class="oculto">Ver la aplicación como</span>
      <select id="rol" aria-label="Ver la aplicación como">
        <option value="ciudadano">Ciudadano</option>
        <option value="operador">Operador</option>
        <option value="administrador">Administrador</option>
      </select>
    </label>
  </div>
  <nav id="menu" class="menu" aria-label="Menú principal"></nav>
</header>

<main id="vista" class="vista" tabindex="-1"></main>

<nav id="menu-movil" class="menu-movil" aria-label="Menú"></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden>
  <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <h3 id="modal-titulo"></h3>
    <p id="modal-texto"></p>
    <div class="modal-botones">
      <button class="btn sec" id="modal-no">Cancelar</button>
      <button class="btn" id="modal-si">Confirmar</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="datos.js"></script>
<script src="db.js"></script>
<script src="consultas.js"></script>
<script src="app.js"></script>
</body>
</html>
